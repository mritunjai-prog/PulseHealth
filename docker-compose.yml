version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pulsehealth
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pulsehealth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data:
